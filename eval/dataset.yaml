# Text-to-SQL 评测集
# 数据只覆盖 2025-01-01 ~ 2025-03-31（Q1），时间问句统一锚定 2025Q1。
# gold_sql 必须能在 dw 库正确执行，run_eval.py 启动时会全量校验。
# category: 用于报告分组；difficulty: easy / medium / hard。

- id: R001
  category: 地区维度
  difficulty: easy
  query: 统计各大区的销售总额
  gold_sql: SELECT r.region_name AS 大区, SUM(f.order_amount) AS 销售总额 FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id GROUP BY r.region_name ORDER BY 销售总额 DESC

- id: R002
  category: 地区维度
  difficulty: easy
  query: 按大区统计订单数量
  gold_sql: SELECT r.region_name AS 大区, COUNT(*) AS 订单数 FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id GROUP BY r.region_name ORDER BY 订单数 DESC

- id: R003
  category: 地区维度
  difficulty: easy
  query: 统计每个省份的销售额
  gold_sql: SELECT r.province AS 省份, SUM(f.order_amount) AS 销售额 FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id GROUP BY r.province ORDER BY 销售额 DESC

- id: R004
  category: 地区维度
  difficulty: easy
  query: 华东地区的销售总额是多少
  gold_sql: SELECT SUM(f.order_amount) AS 销售总额 FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id WHERE r.region_name = '华东'

- id: R005
  category: 地区维度
  difficulty: easy
  query: 华北地区的订单数有多少
  gold_sql: SELECT COUNT(*) AS 订单数 FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id WHERE r.region_name = '华北'

- id: R006
  category: 地区维度
  difficulty: medium
  query: 华南和华东两个大区各自的销售额
  gold_sql: SELECT r.region_name AS 大区, SUM(f.order_amount) AS 销售额 FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id WHERE r.region_name IN ('华南', '华东') GROUP BY r.region_name ORDER BY 销售额 DESC

- id: R007
  category: 地区维度
