  gold_sql: SELECT r.region_name AS 大区, COUNT(*) AS 订单数 FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id GROUP BY r.region_name ORDER BY 订单数 ASC LIMIT 1

- id: R010
  category: 地区维度
  difficulty: medium
  query: 统计华中地区 2025 年第一季度的销量
  gold_sql: SELECT SUM(f.order_quantity) AS 销量 FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id JOIN dim_date d ON f.date_id = d.date_id WHERE r.region_name = '华中' AND d.year = 2025 AND d.quarter = 'Q1'

- id: R011
