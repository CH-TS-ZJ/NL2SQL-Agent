  gold_sql: SELECT c.customer_name AS 客户 FROM fact_order f JOIN dim_customer c ON f.customer_id = c.customer_id JOIN dim_product p ON f.product_id = p.product_id WHERE p.brand = '苹果' AND c.customer_id IN (SELECT f2.customer_id FROM fact_order f2 JOIN dim_product p2 ON f2.product_id = p2.product_id WHERE p2.brand = '华为') GROUP BY c.customer_name

