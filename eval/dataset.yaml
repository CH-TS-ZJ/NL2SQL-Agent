  gold_sql: SELECT r.province AS 城市, SUM(f.order_amount) AS 销售额 FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id WHERE r.province IN ('北京市', '上海市') GROUP BY r.province ORDER BY 销售额 DESC

- id: R008
  category: 地区维度
